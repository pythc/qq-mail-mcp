[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "qq-mail-mcp"
version = "0.2.0"
description = "Self-hosted QQ Mail MCP server with OAuth, search, and configurable outgoing mail"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "qq-mail", "chatgpt", "imap", "smtp", "oauth"]
dependencies = ["mcp>=1.30,<2", "cryptography>=46,<51", "python-dotenv>=1,<2", "uvicorn>=0.35,<1"]

[project.urls]
Homepage = "https://github.com/pythc/qq-mail-mcp"
Repository = "https://github.com/pythc/qq-mail-mcp"
Issues = "https://github.com/pythc/qq-mail-mcp/issues"
Changelog = "https://github.com/pythc/qq-mail-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.14,<1"]

[project.scripts]
qq-mail-mcp = "qq_mail_mcp.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
